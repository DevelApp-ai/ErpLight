name: CI/CD Pipeline

# Package releases follow org decisions DevelApp-ai/DevelApp-Repo-Global#38
# and #73 (incl. the SHA-256 amendment, 2026-11-12). Main pushes and
# release-published events pack once, SIGN with Certum cloud code signing
# (SHA-256 fingerprint interface, identical on .NET 9/.NET 10 SDKs, no SDK
# pin), then publish in the fixed #73 order - GitHub Packages -> GitHub
# Release -> NuGet.org - with loud failures (the NuGet.org push is never
# silently skipped). Prereleases are signed but never pushed to NuGet.org
# (#73: stable-only there). On a main push the publish job cuts the GitHub
# Release (tag v{version}) itself; on a release event the release already
# exists. PR builds never sign.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '8.0.x'
  
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ErpLight.sln
      
    - name: Build solution
      run: dotnet build ErpLight.sln --no-restore --configuration Release
      
    - name: Run tests
      run: dotnet test ErpLight.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
      
    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
        
    - name: Build plugins for runtime loading demo
      run: |
        dotnet build src/plugins/Finance/ERP.Plugin.Finance/ERP.Plugin.Finance.csproj --configuration Release --output src/ERP.Host/plugins
        dotnet build src/plugins/Inventory/ERP.Plugin.Inventory/ERP.Plugin.Inventory.csproj --configuration Release --output src/ERP.Host/plugins  
        dotnet build src/plugins/Products/ERP.Plugin.Products/ERP.Plugin.Products.csproj --configuration Release --output src/ERP.Host/plugins
        dotnet build src/plugins/Orders/ERP.Plugin.Orders/ERP.Plugin.Orders.csproj --configuration Release --output src/ERP.Host/plugins
        dotnet build src/ERP.NuGetDemo/ERP.NuGetDemo.csproj --configuration Release
        
    - name: Test plugin loading with NuGet demo
      shell: bash
      run: |
        cd src/ERP.NuGetDemo
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          # Windows: Use PowerShell with timeout
          powershell -Command "& {
            \$timeout = 60
            \$job = Start-Job -ScriptBlock { dotnet run --configuration Release --no-build }
            if (Wait-Job \$job -Timeout \$timeout) {
              Receive-Job \$job
              Remove-Job \$job
            } else {
              Stop-Job \$job
              Remove-Job \$job
              Write-Host 'Demo completed or timed out safely'
            }
          }"
        else
          # Unix/Linux/macOS: Use timeout command
          timeout 60s dotnet run --configuration Release --no-build || echo "Demo completed or timed out safely"
        fi

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Create NuGet packages
      run: |
        dotnet pack src/ERP.SharedKernel/ERP.SharedKernel.csproj --configuration Release --output ./packages
        dotnet pack src/plugins/Finance/ERP.Plugin.Finance/ERP.Plugin.Finance.csproj --configuration Release --output ./packages
        dotnet pack src/plugins/Inventory/ERP.Plugin.Inventory/ERP.Plugin.Inventory.csproj --configuration Release --output ./packages
        dotnet pack src/plugins/Products/ERP.Plugin.Products/ERP.Plugin.Products.csproj --configuration Release --output ./packages
        dotnet pack src/plugins/Orders/ERP.Plugin.Orders/ERP.Plugin.Orders.csproj --configuration Release --output ./packages
        
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-unsigned
        path: ./packages/*.nupkg

  sign:
    name: Sign NuGet Packages (Certum cloud)
    runs-on: windows-latest
    needs: package
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Download packages
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages-unsigned
        path: packages/

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11). Never sees
      # CERTUM_SIMPLYSIGN_PASSWORD - that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet packages
      # SHA-256 fingerprint interface (decision #73 amendment, 2026-11-12):
      # works identically on .NET 9 and .NET 10 SDKs; no SDK pin needed.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem packages/*.nupkg)
        if (-not $packages.Count) { throw 'No packages found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signatures (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        foreach ($p in @(Get-ChildItem packages/*.nupkg)) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed packages
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-signed
        path: packages/*.nupkg

  publish:
    name: Publish (GitHub Packages -> Release -> NuGet.org)
    runs-on: ubuntu-latest
    needs: [package, sign]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write # release creation (tag v{version}) on main pushes
      packages: write
      id-token: write # OIDC token issuance for NuGet trusted publishing

    steps:
    - name: Download signed packages
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages-signed
        path: packages/

    # Publishing order per org decision #73: GitHub Packages first, GitHub
    # Release second, NuGet.org last. On a release event the GitHub Release
    # already exists (it is the trigger); on a main push the publish job
    # creates it from the package version. The NuGet.org push is never
    # silently skipped - a failure is a visible red job. Prereleases go to
    # GitHub Packages only, never to NuGet.org.
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/DevelApp-ai/index.json --skip-duplicate

    - name: Determine version
      # The csprojs pin 1.0.0; read the version from the SharedKernel nupkg
      # filename (last 3 dot-separated fields before the extension).
      shell: bash
      run: |
        VERSION=$(basename "$(ls packages/DevelApp.ErpLight.SharedKernel*.nupkg | head -n1)" | awk -F. '{print $(NF-3)"."$(NF-2)"."$(NF-1)}')
        if [ -z "$VERSION" ]; then
          echo "::error::Could not derive the package version from the nupkg filename."
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Package version: $VERSION"

    - name: Create or update GitHub Release
      # #73 order: after GitHub Packages, before NuGet.org. On a main push
      # this cuts the release (tag v{version}); on a release event the
      # release already exists and this attaches the packages to it.
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ env.VERSION }}
        name: v${{ env.VERSION }}
        generate_release_notes: true
        files: packages/*.nupkg

    - name: NuGet.org login (OIDC -> temp API key)
      # Trusted publishing (org standard; the long-lived NUGET_API_KEY secret is
      # gone): this job's GitHub OIDC token is exchanged for a ~1-hour nuget.org
      # API key, validated against the trusted publishing policy registered on
      # nuget.org for this repository + workflow:
      #   Repository Owner: DevelApp-ai
      #   Repository:      ErpLight
      #   Workflow File:   ci-cd.yml
      #   Environment:     (none - this job uses no environment)
      # NUGET_USER = the nuget.org profile name of the owning account (NOT an
      # email address). The login runs close to the push (the temp key is
      # short-lived). Fails loudly if the policy is not (yet) registered.
      id: nuget-login
      if: ${{ !github.event.release.prerelease }}
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet.org (stable releases only)
      if: ${{ !github.event.release.prerelease }}
      # Keyless trusted-publishing key from the login step above.
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate